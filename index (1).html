  /* CLARO — padrão */

    --carta:#ffffff; --linha:#dbe0e6; --linha2:#eceff3; --fundo2:#f6f8fa;
    --campo:#ffffff; --btg:#eef1f4; --hover:#b9c1cb; --veu:rgba(20,24,28,.55);
    --texto:#171a1d; --fraco:#61686f;
    --verde:#227a44; --vermelho:#b23a24; --azul:#2c5c8f;
    --av-bg:#e9f6fd; --av-bd:#b5dcf0; --av-tx:#0b4a6e;
    --er-bg:#fdeeea; --er-bd:#f0c3b8; --er-tx:#8f2d1b;

  /* ESCURO */
  body[data-tema="escuro"]{
    --ouro:#2E8BFF; --ouro-claro:#5FD0E6; --mr-verde:#2FD69B; --mr-turq:#22D3EE; --mr-azul:#2E8BFF; --preto:#0b0b0b; --carvao:#121212;
    --carta:#171717; --linha:#262626; --linha2:#1e1e1e; --fundo2:#0d0d0d;
    --campo:#0e0e0e; --btg:#1f1f1f; --hover:#3a3a3a; --veu:rgba(0,0,0,.78);
    --texto:#ededed; --fraco:#9a9a9a;
    --verde:#3ea55f; --vermelho:#c8452f; --azul:#3a6ea5;
    --av-bg:#08161d; --av-bd:#164a5e; --av-tx:#bde6f5;
    --er-bg:#1d0d0a; --er-bd:#55201a; --er-tx:#f0b6a8;
    --ok-bg:#0d1a0f; --ok-bd:#24461f; --ok-tx:#bfe6bf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--preto);color:var(--texto);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
  a{color:var(--ouro-claro)}
  .wrap{max-width:1280px;margin:0 auto;padding:0 14px 80px}

  header.top{background:var(--carvao);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:40}
  .topin{max-width:1280px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:9px}
  .marca b{font-size:16px;letter-spacing:.5px}
  .marca span{font-weight:300;letter-spacing:2px;font-size:11px;color:var(--fraco);display:block}
  .quem{margin-left:auto;text-align:right;font-size:12px;color:var(--fraco)}
  .quem b{color:var(--texto);display:block;font-size:13px}

  /* v44: tela inicial em caixas */
  .bxs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:22px}
  .bx{display:flex;align-items:center;gap:16px;background:var(--carta);border:1px solid var(--linha);border-radius:16px;padding:18px;cursor:pointer;
    text-align:left;width:100%;font:inherit;color:var(--texto);transition:border-color .15s, transform .15s;position:relative}
  .bx:hover{border-color:var(--ouro);transform:translateY(-1px)}
  .bx .ic{flex:0 0 72px;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:40px;
    background:linear-gradient(145deg,rgba(19,185,129,.16),rgba(0,184,217,.12),rgba(10,108,240,.14));border:1px solid rgba(0,184,217,.35)}
  .bx b{display:block;font-size:17px;margin-bottom:4px}
  .bx small{display:block;color:var(--fraco);font-size:13px;line-height:1.35}
  .bx .seta{margin-left:auto;font-size:26px;color:var(--ouro);padding-left:6px}
  .bx .bad{position:absolute;top:10px;left:66px;background:var(--vermelho);color:#fff;border-radius:20px;padding:1px 8px;font-size:12px;font-weight:700}
  .secao{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--linha);padding-bottom:8px;margin:6px 0 14px}
  .secao b{color:var(--ouro);letter-spacing:2px;font-size:15px}
  .secao span{color:var(--fraco);font-size:13px}
  .trilha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0}
  .trilha .cam{color:var(--fraco);font-size:14px}
  .trilha .cam b{color:var(--texto)}
  nav.abas{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0}
  nav.abas button{background:var(--carta);border:1px solid var(--linha);color:var(--fraco);
       padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px}
  nav.abas button.on{background:var(--ouro);border-color:var(--ouro);color:#fff;font-weight:700}
  nav.abas button .bad{background:var(--vermelho);color:#fff;border-radius:20px;padding:1px 7px;margin-left:6px;font-size:11px}

  .card{background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:14px;letter-spacing:.4px;color:var(--ouro-claro)}

  .resumo{cursor:pointer;display:flex;align-items:center;gap:10px}
  .resumo .seta{color:var(--ouro);font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
  .kpi{background:var(--fundo2);border:1px solid var(--linha);border-radius:10px;padding:10px}
  .kpi small{display:block;color:var(--fraco);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .kpi b{font-size:19px;display:block;margin-top:3px}

  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .caixa{background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:13px;cursor:pointer;
         transition:border-color .15s}
  .caixa:hover{border-color:var(--hover)}
  .caixa.aberta{grid-column:1/-1;cursor:default;border-color:var(--ouro);box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .caixa .cnpj{color:var(--fraco);font-size:11px;letter-spacing:.4px}
  .caixa .nome{font-weight:700;font-size:15px;margin:2px 0 8px}

  th{background:var(--fundo2);color:var(--ouro-claro);text-align:left;padding:8px;font-size:11px;

  .tag.e{color:var(--verde);border-color:var(--ok-bd);background:var(--ok-bg)}
  .tag.s{color:var(--vermelho);border-color:var(--er-bd);background:var(--er-bg)}

  button.bt.g{background:var(--btg);color:var(--texto);border:1px solid var(--linha);font-weight:500}
  button.bt.mini{padding:4px 9px;font-size:12px}
  button.bt:disabled{opacity:.5;cursor:not-allowed}

  label{display:block;font-size:11px;color:var(--fraco);text-transform:uppercase;letter-spacing:.5px;margin:9px 0 4px}
  input,select,textarea{width:100%;background:var(--campo);border:1px solid var(--linha);color:var(--texto);

  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ouro)}
  .lin{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 12px}

  .modal{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:18px;

  .psec{border:1px solid var(--linha);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--fundo2)}
  .pti{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px;flex-wrap:wrap}
  .pti a{color:var(--azul,#0A6CF0);font-size:12px}
  .pgr{font-size:10.5px;letter-spacing:1px;color:var(--fraco);font-weight:700;margin:8px 0 4px}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}

  .uac{font-size:12px;color:var(--fraco);margin:6px 0 8px}
  .ubt{display:flex;flex-wrap:wrap;gap:6px}
  .pchk{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--linha);background:var(--carta);color:var(--texto);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;cursor:pointer}

  .pchk .cx{flex:0 0 18px;height:18px;border:2px solid var(--linha);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
  .pchk.on{border-color:#16a3a0;background:rgba(22,163,160,.08)}
  .pchk.on .cx{background:linear-gradient(135deg,#2fbf5a,#16a3a0,#0A6CF0);border-color:transparent}
  .ptag{background:rgba(22,163,160,.12);color:#0f8a87;border-radius:10px;padding:1px 8px;font-weight:700;font-size:11.5px}
  .modal h2{margin:0 0 4px;font-size:17px;color:var(--ouro-claro)}

  .aviso{background:var(--av-bg);border:1px solid var(--av-bd);color:var(--av-tx);padding:9px 11px;border-radius:9px;font-size:12.5px;margin-bottom:10px}
  .erro{background:var(--er-bg);border:1px solid var(--er-bd);color:var(--er-tx);padding:9px 11px;border-radius:9px;font-size:12.5px;margin-bottom:10px}
  .ok{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok-tx);padding:9px 11px;border-radius:9px;font-size:12.5px;margin-bottom:10px}
  .vazio{color:var(--fraco);text-align:center;padding:26px;font-size:13px}

  footer.selo{position:fixed;bottom:0;left:0;right:0;background:var(--carvao);border-top:1px solid var(--linha);
        padding:5px 12px;font-size:11px;color:var(--fraco);display:flex;gap:10px;justify-content:center;z-index:30}
  footer.selo b{color:var(--ouro)}

  .login{max-width:380px;margin:9vh auto;text-align:center}
  .login .card{text-align:left}
  @media(max-width:600px){ .quem{width:100%;text-align:left;margin-left:0} th,td{padding:6px} }

/* ===================== boot ===================== */
async function iniciar(){
  aplicarTema();
  document.getElementById('selo').innerHTML =
    '<span><b>'+SISTEMA.codigo+'</b> '+SISTEMA.versao+'</span><span>'+SISTEMA.nome+'</span><span>'+SISTEMA.casa+' · '+SISTEMA.data+'</span>';
  console.log('%c'+SISTEMA.codigo+' · '+SISTEMA.nome+' · '+SISTEMA.versao+' · '+SISTEMA.data+' · cliente: '+SISTEMA.cliente,
              'color:#0A6CF0;font-weight:bold');

  // a chave pode vir do arquivo OU ser colada na tela (fica guardada no aparelho)
  const guardada = (function(){ try{ return localStorage.getItem('cpe_anon')||''; }catch(e){ return ''; } })();
  if(guardada && guardada.length>40) CFG.anon = guardada;

  if(CFG.anon.indexOf('COLE_AQUI')===0){
    document.getElementById('app').innerHTML =
      '<div class="login"><div style="margin-bottom:14px">'+marcaSVG(64)+'</div>'+
      '<h2 style="margin:0 0 2px;letter-spacing:.5px">CONTAS POR EMPRESA</h2>'+
      '<div style="color:var(--fraco);font-size:12px;letter-spacing:2px;margin-bottom:18px">'+SISTEMA.casa.toUpperCase()+'</div>'+
      '<div class="card">'+
        '<h3 style="margin-top:0">Primeira vez neste aparelho</h3>'+
        '<div class="aviso">Cole a chave <b>anon public</b> do projeto. Ela fica guardada aqui e você não precisa fazer isso de novo.<br>'+
        'Supabase &gt; Project Settings &gt; API &gt; anon public</div>'+
        '<label>Chave anon public</label>'+
        '<textarea id="cfg-anon" rows="4" placeholder="eyJ..." style="font-size:12px"></textarea>'+
        '<div id="cfg-erro" style="color:#f0b6a8;font-size:12.5px;margin-top:6px"></div>'+
        '<div style="margin-top:14px"><button class="bt" style="width:100%" onclick="salvarChave()">Salvar e entrar</button></div>'+
      '</div>'+
      '<div style="color:var(--fraco);font-size:11px">'+SISTEMA.codigo+' '+SISTEMA.versao+'</div></div>';
    return;
  }
  sb = window.supabase.createClient(CFG.url, CFG.anon, { auth:{ persistSession:true, autoRefreshToken:true } });
  if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const tokA = new URLSearchParams(location.search).get('a');
  if(tokA){ S.anesTok = tokA; S.av = { mes: hojeISO().slice(0,7), dados:null }; render(); anesCarregar(); return; }
  const { data } = await sb.auth.getSession();
  if(data && data.session){ S.user = data.session.user; await carregarTudo(); }
  render();
}

function salvarChave(){
  const k = (val('cfg-anon')||'').trim();
  const err = document.getElementById('cfg-erro');
  if(k.length < 30 || (k.indexOf('eyJ') !== 0 && k.indexOf('sb_publishable_') !== 0)){
    if(err) err.textContent = 'Isso não parece a chave pública (ela começa com eyJ ou sb_publishable_).';
    return;
  }
  if(k.indexOf('service_role') >= 0 || k.indexOf('sb_secret_') === 0){
    if(err) err.textContent = 'Essa é a service_role — nunca use ela aqui. Copie a anon public.';
    return;
  }
  try{ localStorage.setItem('cpe_anon', k); }catch(e){}
  location.reload();
}

async function entrar(){
  const email = val('lg-email').trim(), senha = val('lg-senha');
  if(!email || !senha) return aviso('Informe e-mail e senha.','erro');
  S.carregando = true; render();
  const { data, error } = await sb.auth.signInWithPassword({ email, password:senha });
  S.carregando = false;
  if(error) return aviso('Não entrou: '+error.message,'erro');
  S.user = data.user;
  await carregarTudo();
  render();
}
async function sair(){ await sb.auth.signOut(); S.user=null; S.perfil=null; S.movimentos=[]; S.empresas=[]; S.esc.carregado=false; S.tela='inicio'; render(); }

/* ===================== carga ===================== */
async function carregarTudo(){
  S.carregando = true; render();
  try{
    const { data:perfil } = await sb.from('perfis').select('*').eq('id', S.user.id).maybeSingle();
    S.perfil = perfil || null;
    if(!S.perfil){ aviso('Seu login existe, mas ainda não tem perfil no sistema. Peça ao administrador.','erro'); S.carregando=false; return; }
    if(S.perfil.ativo === false){ aviso('Seu acesso está desativado.','erro'); S.carregando=false; return; }
    if(S.perfil.papel==='anestesista'){ S.empresas=[]; S.origens=[]; S.movimentos=[]; S.regras=[]; S.tela='escala'; await escCarregar(); S.carregando=false; return; }

    const [emp, ori, mov, reg] = await Promise.all([
      sb.from('empresas').select('*').order('razao_social'),
      sb.from('origens').select('*').order('nome'),
      sb.from('movimentos').select('*').order('data_movimento',{ascending:false}).limit(4000),
      sb.from('regras_fornecedor').select('*')
    ]);
    S.empresas   = emp.data || [];
    S.origens    = ori.data || [];
    S.movimentos = mov.data || [];
    S.regras     = reg.data || [];
    if(podeUsuarios()){
      const { data:ps } = await sb.from('perfis').select('*').order('papel');
      S.perfis = ps || [];
    }
  }catch(e){ aviso('Erro ao carregar: '+e.message,'erro'); }
  S.carregando = false;
}

function papel(){ return S.perfil ? S.perfil.papel : null; }
function ehAnes(){ return papel()==='anestesista'; }   // v54: login do anestesista — só olha; só valida os próprios plantões
function podeEditar(){ return ['mestre','dono','operador'].indexOf(papel())>=0; }
function podeUsuarios(){ return ['mestre','dono'].indexOf(papel())>=0; }
function podeApagar(){ return ['mestre','dono'].indexOf(papel())>=0; }
/* v69 (Renato, 03/11/2026): PERMISSÕES POR LOGIN — dentro de Usuários. Cada login pode ter as abas que enxerga e os hospitais
   que enxerga (um, vários ou todos). perfis.abas = null → todas as abas do papel; perfis.hospitais = null/vazio → todos.
   O banco também trava (RLS em esc_locais/esc_dias por hospital). Mestre vê tudo sempre. */
const CPE_ABAS = [
  ['FINANCEIRO', [['painel','🏢','CNPJs'],['fila','📌','Apontar depois'],['origens','💳','Cartões e contas'],['nomes','🏷️','Nomes']]],
  ['ESCALAS',    [['nafs','🩺','NAFS'],['anestesia','💉','ANESTESIA']]],
  ['DENTRO DA NAFS / ANESTESIA', [['escala','➕','Adicionar paciente'],['escalas','🗓️','Escalas'],['producao','💰','Financeiro'],['hospitais','🏥','Cadastro de hospitais']]],
  ['CADASTROS',  [['empresas','🏛️','Empresas']]]
];
function permNorm(t){ return String(t||'').trim().toLowerCase(); }
function veAba(k){ if(papel()==='mestre') return true; const a = S.perfil && S.perfil.abas; return !Array.isArray(a) || a.indexOf(k)>=0; }
function veHosp(nome){ if(papel()==='mestre') return true; const h = S.perfil && S.perfil.hospitais;
  return !Array.isArray(h) || !h.length || h.map(permNorm).indexOf(permNorm(nome))>=0; }
function abaDaTela(t){ if(t==='escalahub') return escGrupo()==='ANESTESIA' ? 'anestesia' : 'nafs'; return t; }

/* ===================== filtros ===================== */
function doMes(m){ return (m.data_movimento||'').slice(0,7) === S.mes; }
/* v68 (Renato): o Painel abre com o TOTAL GLOBAL de cada CNPJ (todos os meses). O filtro de calendário (mês, dia ou período) é opcional. */
var PF = { modo:'tudo', mes:'', dia:'', de:'', ate:'' };
function pfOk(m){ const d = String(m.data_movimento||'').slice(0,10);
  if(PF.modo==='mes') return d.slice(0,7)===(PF.mes||mesHoje());
  if(PF.modo==='dia') return d===(PF.dia||hojeISO());
  if(PF.modo==='periodo') return (!PF.de || d>=PF.de) && (!PF.ate || d<=PF.ate);
  return true; }
function pfModo(m){ PF.modo = m; if(m==='mes' && !PF.mes) PF.mes = mesHoje(); if(m==='dia' && !PF.dia) PF.dia = hojeISO(); render(); }
function pfSet(k,v){ PF[k] = v; render(); }
function pfMesMover(n){ const p=(PF.mes||mesHoje()).split('-'); const d=new Date(+p[0], +p[1]-1+n, 1); PF.mes = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); render(); }
function pfDiaMover(n){ const d=new Date((PF.dia||hojeISO())+'T12:00:00'); d.setDate(d.getDate()+n); PF.dia = d.toISOString().slice(0,10); render(); }
function pfTexto(){ if(PF.modo==='mes') return escMesNome(PF.mes||mesHoje()); if(PF.modo==='dia') return dataBR(PF.dia||hojeISO());
  if(PF.modo==='periodo') return (PF.de?dataBR(PF.de):'início')+' a '+(PF.ate?dataBR(PF.ate):'hoje'); return 'todos os meses'; }
function movsDaEmpresa(id){ return S.movimentos.filter(m=>m.empresa_id===id && pfOk(m)); }
function fila(){ return S.movimentos.filter(m=>!m.empresa_id); }
function totais(lista){
  let ent=0, sai=0, pago=0;
  lista.forEach(m=>{ const v=Number(m.valor)||0;
    if(m.tipo==='entrada') ent+=v; else { sai+=v; if(m.pago) pago+=v; } });
  return { ent, sai, pago, saldo:ent-sai, pct: sai>0 ? Math.min(100,Math.round(pago/sai*100)) : 0 };
}
function nomeEmpresa(id){ const e=S.empresas.find(x=>x.id===id); return e ? (e.apelido||e.razao_social) : '—'; }
function nomeOrigem(id){ const o=S.origens.find(x=>x.id===id); return o ? o.nome+(o.identificador?' ·'+o.identificador:'') : '—'; }

/* ===================== render ===================== */
function render(){
  const app = document.getElementById('app');
  if(S.anesTok){ app.innerHTML = telaAnesValidar(); return; }
  if(!S.user){ app.innerHTML = telaLogin(); return; }

  let corpo = '';
  if(ehAnes() && ['meus','escala'].indexOf(S.tela)<0) S.tela = 'escala';
  if(!ehAnes() && S.tela!=='inicio' && S.tela!=='usuarios' && !veAba(abaDaTela(S.tela))) S.tela = 'inicio';   // v69   // v56: anestesista só tem o NAFS e a escala individual dele
  if(S.carregando && !S.empresas.length && !ehAnes()) corpo = '<div class="vazio">Carregando…</div>';
  else if(S.carregando && ehAnes()) corpo = '<div class="vazio">Carregando…</div>';
  else if(S.tela==='meus')     corpo = telaMeus();
  else if(S.tela==='inicio')   corpo = telaInicio();
  else if(S.tela==='escalahub') corpo = telaEscalaHub();
  else if(S.tela==='painel')   corpo = telaPainel();
  else if(S.tela==='fila')     corpo = telaFila();
  else if(S.tela==='nomes')    corpo = telaNomes();
  else if(S.tela==='origens')  corpo = telaOrigens();
  else if(S.tela==='empresas') corpo = telaEmpresas();
  else if(S.tela==='usuarios') corpo = telaUsuarios();
  else if(S.tela==='escala')   corpo = telaEscala();
  else if(S.tela==='escalas')  corpo = telaEscalas();
  else if(S.tela==='hospitais') corpo = podeEditar() ? telaHospCad() : telaEscalaHub();
  else if(S.tela==='producao') corpo = podeUsuarios() ? telaProducao() : telaEscalaHub();

  const nf = fila().length;
  app.innerHTML =
    '<header class="top"><div class="topin">'+
      '<div class="marca" style="cursor:pointer" onclick="irPara(\'inicio\')">'+marcaSVG(38)+'<div><b>CONTAS POR EMPRESA</b><span>'+SISTEMA.casa.toUpperCase()+'</span></div></div>'+
      '<button class="bt g mini" style="margin-left:auto" onclick="trocarTema()" title="Claro / escuro">'+(temaAtual()==='escuro'?'☀ claro':'🌙 escuro')+'</button>'+
      '<div class="quem" style="margin-left:12px"><b>'+esc(S.perfil? (S.perfil.nome||S.perfil.email) : '')+'</b>'+
        esc(papel()||'')+' · <a href="#" onclick="sair();return false">sair</a></div>'+
    '</div></header>'+
    '<div class="wrap">'+
      cpeTrilha()+
      (S.msg? '<div class="'+S.msgTipo+'">'+esc(S.msg)+'</div>' : '')+
      corpo+
    '</div>'+
    (S.modal || '');
}
function temaAtual(){ try{ return localStorage.getItem('cpe_tema')||'claro'; }catch(e){ return 'claro'; } }
function aplicarTema(){ document.body.setAttribute('data-tema', temaAtual()); }
function trocarTema(){ const novo = temaAtual()==='escuro'?'claro':'escuro';
  try{ localStorage.setItem('cpe_tema',novo); }catch(e){} aplicarTema(); render(); }

function aba(id,rot){ return '<button class="'+(S.tela===id?'on':'')+'" onclick="irPara(\''+id+'\')">'+rot+'</button>'; }
function irPara(t){ if(t!=='inicio' && t!=='usuarios' && t!=='meus' && !ehAnes() && !veAba(abaDaTela(t))){ aviso('Você não tem acesso a esta aba.','erro'); return; } S.tela=t; S.msg=null; render(); }

function telaLogin(){
  return '<div class="login">'+
    '<div style="margin-bottom:14px">'+marcaSVG(64)+'</div>'+
    '<h2 style="margin:0 0 2px;letter-spacing:.5px">CONTAS POR EMPRESA</h2>'+
    '<div style="color:var(--fraco);font-size:12px;letter-spacing:2px;margin-bottom:18px">'+SISTEMA.casa.toUpperCase()+'</div>'+

    '<div class="resumo" onclick="S.resumoAberto=!S.resumoAberto;render()">'+

      '<h3 style="margin:0">RESUMO GERAL <span style="font-weight:400;color:var(--fraco);font-size:12px">· '+pfTexto()+'</span></h3>'+
      '<span style="margin-left:auto;color:var(--fraco);font-size:12px">'+
        (S.resumoAberto?'clique para fechar':'saldo '+brl(t.saldo))+'</span>'+
    '</div>'+
    (S.resumoAberto ? '<div class="kpis">'+
      kpi('Entradas', brl(t.ent))+
      kpi('Saídas', brl(t.sai))+
      kpi('Saldo', brl(t.saldo))+

}
function pfBarra(){
  const ch = (m, txt) => '<button type="button" onclick="pfModo(\''+m+'\')" style="padding:8px 12px;border-radius:9px;cursor:pointer;font-size:13.5px;'+
    (PF.modo===m?'background:var(--ouro);color:#fff;border:1px solid var(--ouro);font-weight:700':'background:var(--campo);color:var(--texto);border:1px solid var(--linha)')+'">'+txt+'</button>';
  let campo = '';
  if(PF.modo==='mes') campo = '<button class="bt g mini" onclick="pfMesMover(-1)">‹</button><input type="month" value="'+(PF.mes||mesHoje())+'" onchange="pfSet(\'mes\',this.value)" style="width:auto"><button class="bt g mini" onclick="pfMesMover(1)">›</button>';
  if(PF.modo==='dia') campo = '<button class="bt g mini" onclick="pfDiaMover(-1)">‹</button><input type="date" value="'+(PF.dia||hojeISO())+'" onchange="pfSet(\'dia\',this.value)" style="width:auto"><button class="bt g mini" onclick="pfDiaMover(1)">›</button>';
  if(PF.modo==='periodo') campo = '<span style="font-size:13px;color:var(--fraco)">de</span><input type="date" value="'+PF.de+'" onchange="pfSet(\'de\',this.value)" style="width:auto"><span style="font-size:13px;color:var(--fraco)">até</span><input type="date" value="'+PF.ate+'" onchange="pfSet(\'ate\',this.value)" style="width:auto">';
  return '<div style="flex-basis:100%;display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+
    '<span style="font-size:12px;color:var(--fraco);font-weight:700;margin-right:4px">📅 VER</span>'+
    ch('tudo','Tudo (global)')+ch('mes','Mês')+ch('dia','Dia')+ch('periodo','Período')+
    (campo?'<span style="display:inline-flex;gap:6px;align-items:center;margin-left:6px;flex-wrap:wrap">'+campo+'</span>':'')+'</div>';
}
function kpi(t,v){ return '<div class="kpi"><small>'+t+'</small><b>'+v+'</b></div>'; }

function caixa(e){
  const movs = movsDaEmpresa(e.id);
  const t = totais(movs);
  const aberta = S.aberta === e.id;
  let h = '<div class="caixa'+(aberta?' aberta':'')+'" onclick="'+(aberta?'':'abrirCaixa(\''+e.id+'\')')+'">'+
    '<div style="display:flex;align-items:flex-start;gap:8px">'+
      '<div style="flex:1">'+
        '<div class="cnpj">'+esc(mascaraCNPJ(e.cnpj))+'</div>'+
        '<div class="nome">'+esc(e.apelido||e.razao_social)+'</div>'+
      '</div>'+
      (aberta? '<button class="bt g mini" onclick="event.stopPropagation();S.aberta=null;render()">fechar ✕</button>':'')+
    '</div>'+
    '<div class="barra"><i style="width:'+t.pct+'%"></i></div>'+
    '<div class="miniln"><span>'+t.pct+'% pago</span><span>'+brl(t.pago)+' de '+brl(t.sai)+'</span></div>'+
    '<div class="miniln"><span>entradas '+brl(t.ent)+'</span>'+
      '<span style="color:'+(t.saldo>=0?'var(--verde)':'var(--vermelho)')+'">saldo '+brl(t.saldo)+'</span></div>';

  if(aberta){
    h += '<div style="margin-top:14px">'+ tabelaMovimentos(movs) +'</div>';
  }
  return h + '</div>';
}
function abrirCaixa(id){ S.aberta = id; render(); }

function tabelaMovimentos(movs){
  if(!movs.length) return '<div class="vazio">Nenhum movimento em '+pfTexto()+'.</div>';
  const linhas = movs.slice().sort((a,b)=> (b.data_movimento||'').localeCompare(a.data_movimento||''))
   .map(m=>{
    const ent = m.tipo==='entrada';
    return '<tr class="'+(m.pago&&!ent?'pago':'')+'">'+
      '<td>'+dataBR(m.data_movimento)+'</td>'+
      '<td><span class="tag '+(ent?'e':'s')+'">'+(ent?'entrada':'saída')+'</span></td>'+
      '<td><b>'+esc(m.fornecedor||m.descricao||'—')+'</b>'+
        (m.descricao&&m.fornecedor? '<div style="color:var(--fraco);font-size:12px">'+esc(m.descricao)+'</div>':'')+
        (m.cnpj_fornecedor? '<div style="color:var(--fraco);font-size:11px">'+esc(mascaraCNPJ(m.cnpj_fornecedor))+'</div>':'')+
        (m.lido_por_ia? '<div style="color:var(--fraco);font-size:11px">lido do documento</div>':'')+
      '</td>'+
      '<td>'+esc(nomeOrigem(m.origem_id))+'</td>'+
      '<td style="text-align:right;white-space:nowrap"><b>'+brl(m.valor)+'</b></td>'+
      '<td style="white-space:nowrap">'+
        (ent? '' :
          (podeEditar()? '<button class="bt '+(m.pago?'g':'')+' mini" onclick="event.stopPropagation();alternarPago(\''+m.id+'\')">'+(m.pago?'reabrir':'pagar')+'</button> ' : (m.pago?'paga':'em aberto')))+
        (podeEditar()? '<button class="bt g mini" onclick="event.stopPropagation();editarMov(\''+m.id+'\')">editar</button> ' : '')+
        (m.anexo_path? '<button class="bt g mini" onclick="event.stopPropagation();verAnexo(\''+m.anexo_path+'\')">nota</button> ' : '')+
        (podeApagar()? '<button class="bt g mini" onclick="event.stopPropagation();excluirMov(\''+m.id+'\')">✕</button>' : '')+
      '</td></tr>';
  }).join('');
  return '<table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Origem</th>'+
         '<th style="text-align:right">Valor</th><th></th></tr></thead><tbody>'+linhas+'</tbody></table>';
}

/* ---------- FILA: saídas sem empresa ---------- */
function telaFila(){
  const lista = fila();
  const ent = lista.filter(m=>m.tipo==='entrada');
  const sai = lista.filter(m=>m.tipo==='saida');
  const tEnt = ent.reduce((s,x)=>s+(Number(x.valor)||0),0);
  const tSai = sai.reduce((s,x)=>s+(Number(x.valor)||0),0);

  const aviso = '<div class="aviso">Cada lançamento fica na sua caixa até alguém apontar de qual CNPJ é. '+
    'Ao apontar, dá para gravar a regra: da próxima vez esse mesmo nome já cai na empresa certa.</div>';

  if(!lista.length) return '<div class="card"><h3>APONTAR DEPOIS</h3>'+aviso+
    '<div class="vazio">Nada pendente. As duas caixas estão limpas.</div></div>';

  let h = '<div class="card">'+aviso+'</div>';

  // CAIXA DAS ENTRADAS
  h += '<div class="card" style="border-color:'+(ent.length?'var(--verde)':'var(--linha)')+'">'+
    '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px">'+
      '<h3 style="margin:0;color:var(--verde)">ENTRADAS SEM EMPRESA</h3>'+
      '<span style="font-size:13px;color:var(--fraco)">'+ent.length+
        (ent.length===1?' lançamento':' lançamentos')+'</span>'+
      '<b style="margin-left:auto;font-size:20px;color:var(--verde)">+ '+brl(tEnt)+'</b>'+
    '</div>'+
    (ent.length ? filaCartoes(ent) : '<div class="vazio">Nenhuma entrada pendente.</div>')+
  '</div>';

  // CAIXA DAS SAÍDAS
  h += '<div class="card" style="border-color:'+(sai.length?'var(--vermelho)':'var(--linha)')+'">'+
    '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px">'+
      '<h3 style="margin:0;color:var(--vermelho)">SAÍDAS SEM EMPRESA</h3>'+
      '<span style="font-size:13px;color:var(--fraco)">'+sai.length+
        (sai.length===1?' lançamento':' lançamentos')+'</span>'+
      '<b style="margin-left:auto;font-size:20px;color:var(--vermelho)">− '+brl(tSai)+'</b>'+
    '</div>'+
    (sai.length ? filaCartoes(sai) : '<div class="vazio">Nenhuma saída pendente.</div>')+
  '</div>';

  return h;
}

function filaCartoes(lista){
  return lista.map(m=>{
    const sug = sugerirEmpresa(m);
    return '<div style="border:1px solid var(--linha);border-radius:10px;padding:11px;margin-bottom:9px">'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">'+
        '<div style="flex:1;min-width:200px"><b>'+esc(m.fornecedor||m.descricao||'(sem descrição)')+'</b>'+
          '<div style="font-size:19px;font-weight:700;margin:2px 0;color:'+
            (m.tipo==='entrada'?'var(--verde)':'var(--vermelho)')+'">'+
            (m.tipo==='entrada'?'+ ':'− ')+brl(m.valor)+
            ' <span style="font-size:11px;font-weight:500;letter-spacing:.5px">'+
            (m.tipo==='entrada'?'ENTRADA':'SAÍDA')+'</span></div>'+
          '<div style="color:var(--fraco);font-size:12px">'+dataBR(m.data_movimento)+
          ' · '+esc(nomeOrigem(m.origem_id))+'</div>'+
          (m.cnpj_fornecedor? '<div style="color:var(--fraco);font-size:11px">'+esc(mascaraCNPJ(m.cnpj_fornecedor))+'</div>':'')+
        '</div>'+
        '<div style="min-width:200px"><select id="fila-'+m.id+'">'+
          '<option value="">— escolher empresa —</option>'+
          S.empresas.map(e=>'<option value="'+e.id+'"'+(sug===e.id?' selected':'')+'>'+esc(e.apelido||e.razao_social)+'</option>').join('')+
        '</select></div>'+
        '<div><button class="bt" onclick="apontar(\''+m.id+'\')">apontar</button></div>'+
      '</div>'+
      '<label style="text-transform:none;letter-spacing:0;color:var(--fraco);display:flex;gap:6px;align-items:center;margin-top:8px">'+
        '<input type="checkbox" id="regra-'+m.id+'" style="width:auto" checked> gravar regra para este fornecedor'+
      '</label>'+
      (sug? '<div style="color:var(--ouro-claro);font-size:11.5px;margin-top:4px">sugerido por regra já gravada</div>':'')+
    '</div>';
  }).join('');
}
function sugerirEmpresa(m){
  const cnpj = soDig(m.cnpj_fornecedor);
  let r = cnpj ? S.regras.find(x=>x.tipo_chave==='cnpj' && soDig(x.chave)===cnpj) : null;
  if(!r && m.fornecedor) r = S.regras.find(x=>x.tipo_chave==='nome' && norm(x.chave)===norm(m.fornecedor));
  if(!r && m.origem_id)  r = S.regras.find(x=>x.tipo_chave==='origem' && x.chave===m.origem_id);
  return r ? r.empresa_id : null;
}
async function apontar(id){
  const empresa = val('fila-'+id);
  if(!empresa) return aviso('Escolha a empresa.','erro');
  const m = S.movimentos.find(x=>x.id===id);
  const { error } = await sb.from('movimentos').update({ empresa_id:empresa }).eq('id',id);
  if(error) return aviso('Não gravou: '+error.message,'erro');
  m.empresa_id = empresa;

  if(chk('regra-'+id)){
    const chave = soDig(m.cnpj_fornecedor) || m.fornecedor || m.origem_id;
    const tipo  = soDig(m.cnpj_fornecedor) ? 'cnpj' : (m.fornecedor ? 'nome' : 'origem');
    if(chave){
      const { error:e2 } = await sb.from('regras_fornecedor')
        .upsert({ chave:String(chave), tipo_chave:tipo, empresa_id:empresa, criado_por:S.user.id },
                { onConflict:'tipo_chave,chave' });
      if(!e2){ const { data } = await sb.from('regras_fornecedor').select('*'); S.regras = data||S.regras; }
    }
  }
  aviso('Apontado para '+nomeEmpresa(empresa)+'.','ok');
}

/* ---------- NOMES: quem se repete no extrato ---------- */
function nomesAgrupados(){
  const mapa = {};
  S.movimentos.forEach(m=>{
    const bruto = (m.fornecedor||'').trim();
    if(!bruto) return;
    const ch = norm(bruto);
    if(!ch) return;
    if(!mapa[ch]) mapa[ch] = { chave:ch, nome:bruto, qtd:0, sai:0, ent:0, semEmpresa:0, ids:[] };
    const g = mapa[ch];
    g.qtd++;
    g.ids.push(m.id);
    if(m.tipo==='entrada') g.ent += Number(m.valor)||0; else g.sai += Number(m.valor)||0;
    if(!m.empresa_id) g.semEmpresa++;
    if(bruto.length > g.nome.length) g.nome = bruto;   // guarda a grafia mais completa
  });
  return Object.values(mapa).sort((a,b)=> b.qtd - a.qtd || (b.sai+b.ent) - (a.sai+a.ent));
}
function regraDoNome(chave){
  return S.regras.find(r=> r.tipo_chave==='nome' && norm(r.chave)===chave) || null;
}

async function definirNome(chave, nome){
  const empresa = val('nm-'+chave.replace(/[^A-Z0-9]/g,''));
  if(!empresa) return aviso('Escolha a empresa de destino.','erro');

  const { error } = await sb.from('regras_fornecedor')
    .upsert({ chave:nome, tipo_chave:'nome', empresa_id:empresa, criado_por:S.user.id },
            { onConflict:'tipo_chave,chave' });
  if(error) return aviso('Não gravou a regra: '+error.message,'erro');

  // leva junto o que ainda está na fila
  const pendentes = S.movimentos.filter(m=>!m.empresa_id && norm(m.fornecedor||'')===chave);
  let movidos = 0;
  if(pendentes.length){
    const ids = pendentes.map(m=>m.id);
    const { error:e2 } = await sb.from('movimentos').update({ empresa_id:empresa }).in('id', ids);
    if(e2) return aviso('Regra salva, mas não movi a fila: '+e2.message,'erro');
    pendentes.forEach(m=>{ m.empresa_id = empresa; movidos++; });
  }
  const { data } = await sb.from('regras_fornecedor').select('*');
  S.regras = data || S.regras;
  aviso(esc(nome)+' → '+nomeEmpresa(empresa)+(movidos? ' · '+movidos+' lançamento(s) saíram da fila':'')+'. Os próximos já vêm apontados.','ok');
}

async function limparNome(chave){
  const r = regraDoNome(chave);
  if(!r) return;
  const { error } = await sb.from('regras_fornecedor').delete().eq('id', r.id);
  if(error) return aviso('Não removeu: '+error.message,'erro');
  S.regras = S.regras.filter(x=>x.id!==r.id);
  aviso('Destino removido. Os lançamentos já apontados continuam como estão.','ok');
}

/* --- leitura do documento --- */
let _arquivoPendente = null, _lidoPorIA = false;
function statusLeitura(t){ const e=document.getElementById('mv-leitura'); if(e) e.innerHTML=t; }

async function lerDocumento(){
  const inp = document.getElementById('mv-arq');
  const f = inp && inp.files && inp.files[0];
  if(!f) return;
  _arquivoPendente = f; _lidoPorIA = false;
  statusLeitura('Lendo o documento…');
  try{
    let dados = null;
    if(f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){
      const texto = await textoDoPDF(f, 30);
      // extrato não é nota: tem vários lançamentos e não cabe num lançamento só
      const linhasExtrato = extratoLinhas(texto||'');
      const cheiroDeExtrato = /extrato|lan[çc]amentos?\s+valor|saldo\s+anterior|saldo\s+em\s+\d{2}\/|per[ií]odo de\s+\d{2}\//i.test(texto||'');
      if(linhasExtrato.length >= 3 || (cheiroDeExtrato && linhasExtrato.length >= 1)){
        _arquivoPendente = null;
        const e = document.getElementById('mv-arq'); if(e) e.value = '';
        statusLeitura('<b>Isso é um extrato</b> ('+linhasExtrato.length+' lançamentos) — não cabe num lançamento só.<br>'+
          '<button class="bt mini" style="margin-top:8px" onclick="fecharModal();irPara(\'origens\');abrirExtrato()">Abrir a importação de extrato</button>');
        return;
      }
      if(texto && texto.replace(/\s/g,'').length > 40){ dados = extrairDoTexto(texto); statusLeitura('Lido do PDF (sem custo de IA).'); }
    }
    if(!dados){
      statusLeitura('Sem texto no arquivo — mandando para a leitura por IA…');
      dados = await lerPorIA(f); _lidoPorIA = true;
      statusLeitura(dados ? 'Lido por IA.' : 'A IA não conseguiu ler. Preencha à mão.');
    }
    if(dados) aplicarLeitura(dados);
  }catch(e){ statusLeitura('Não deu para ler: '+e.message+'. Preencha à mão — o arquivo continua anexado.'); }
}

/* alguns PDFs (faturas de cartão) escrevem com espaço entre cada letra:
   "M A R C U S" precisa virar "MARCUS" antes de qualquer leitura */
function desespacar(t){
  const toks = String(t||'').trim().split(/\s+/);
  if(toks.length < 3) return t;
  const soltos = toks.filter(x=>x.length===1).length;
  return (soltos / toks.length) > 0.6 ? toks.join('') : t;
}

async function itensDoPDF(file, maxPag){
  if(!window.pdfjsLib) return [];
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data:buf }).promise;
  const itens = [];
  const n = Math.min(pdf.numPages, maxPag || 30);
  for(let i=1;i<=n;i++){
    const pg = await pdf.getPage(i);
    const c = await pg.getTextContent();
    c.items.forEach(it=>{
      const str = String(it.str||'').trim();
      if(!str) return;
      itens.push({ pag:i, x:it.transform[4], y:it.transform[5], str: desespacar(str),
                   ordem: i*100000 - it.transform[5] });   // posição vertical contínua
    });
  }
  itens.sort((a,b)=> a.ordem - b.ordem || a.x - b.x);
  return itens;
}

/* Monta os lançamentos pelas COLUNAS, não pelas linhas.
   Num extrato a data fica na coluna da esquerda e pode estar alguns pontos
   acima ou abaixo da descrição — por isso cada pedaço é ligado à data MAIS
   PRÓXIMA na vertical, e não à linha em que caiu. */
function extratoDosItens(itens){
  const reDataSo = /^\d{2}\/\d{2}\/\d{4}$/;
  const reMoeda  = /^(-\s*)?R\$\s*([\d.]+,\d{2})$/;
  const datas = itens.filter(i=> reDataSo.test(i.str) && i.x < 80);
  if(!datas.length) return [];

  const recs = datas.map(d=>{
    const p = d.str.split('/');
    return { ordem:d.ordem, pag:d.pag, data:p[2]+'-'+p[1]+'-'+p[0], desc:[], moedas:[] };
  });

  itens.forEach(it=>{
    if(reDataSo.test(it.str) && it.x < 80) return;
    if(it.x < 80) return;                                  // coluna da data: ignora o resto
    let melhor = null, dist = 1e9;
    recs.forEach(r=>{
      if(r.pag !== it.pag) return;
      const d = Math.abs(r.ordem - it.ordem);
      if(d < dist){ dist = d; melhor = r; }
    });
    if(!melhor || dist > 14) return;                       // fora da faixa da transação
    const m = it.str.match(reMoeda);
    if(m) melhor.moedas.push({ x:it.x, neg:!!m[1], v:extratoValor(m[2]) });
    else melhor.desc.push({ ordem:it.ordem, x:it.x, s:it.str });
  });

  const out = [];
  recs.forEach(r=>{
    r.moedas.sort((a,b)=>a.x-b.x);
    if(!r.moedas.length) return;
    const val = r.moedas[0];
    const sld = r.moedas.length > 1 ? (r.moedas[1].neg ? -r.moedas[1].v : r.moedas[1].v) : null;
    r.desc.sort((a,b)=> a.ordem-b.ordem || a.x-b.x);
    const desc = extratoLimpa(r.desc.map(d=>d.s).join(' '));
    if(!val.v || !extratoValido(desc)) return;
    out.push({ data:r.data, descricao:desc.slice(0,140),
               contraparte:((desc.match(/\/\s*([^)]{3,80})\)/)||[])[1]||'').trim(),
               valor:val.v, tipo: val.neg ? 'saida' : 'entrada', saldo: sld });
  });
  return out;
}

async function linhasDoPDF(file, maxPag){
  if(!window.pdfjsLib) return [];
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data:buf }).promise;
  const linhas = [];
  const n = Math.min(pdf.numPages, maxPag || 3);
  for(let i=1;i<=n;i++){
    const pg = await pdf.getPage(i);
    const c = await pg.getTextContent();
    // agrupa os pedaços por altura (y) — remonta a linha como ela aparece na página
    const grupos = [];
    c.items.forEach(it=>{
      const x = it.transform[4], y = Math.round(it.transform[5]);
      let g = grupos.find(gg=>Math.abs(gg.y - y) <= 3);
      if(!g){ g = { y, partes:[] }; grupos.push(g); }
      g.partes.push({ x, str: it.str });
    });
    grupos.sort((a,b)=> b.y - a.y);                       // no PDF o y cresce para cima
    grupos.forEach(g=>{
      g.partes.sort((a,b)=> a.x - b.x);
      const txt = g.partes.map(p=>p.str).join(' ').replace(/\s+/g,' ').trim();
      if(txt) linhas.push(txt);
    });
  }
  return linhas;
}

async function textoDoPDF(file, maxPag){
  const linhas = await linhasDoPDF(file, maxPag);
  return linhas.join('\n');
}

function extrairDoTexto(t){
  const d = {};
  const mc = t.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g);
  if(mc){ const bom = mc.find(x=>validaCNPJ(x)); if(bom) d.cnpj = soDig(bom); }
  const mv = t.match(/(?:VALOR\s*(?:TOTAL|A\s*PAGAR|DO\s*DOCUMENTO)?|TOTAL\s*(?:GERAL|A\s*PAGAR)?)\D{0,18}(\d{1,3}(?:\.\d{3})*,\d{2})/i);
  if(mv) d.valor = Number(mv[1].replace(/\./g,'').replace(',','.'));
  else { const todos = t.match(/\d{1,3}(?:\.\d{3})*,\d{2}/g);
         if(todos) d.valor = Math.max.apply(null, todos.map(v=>Number(v.replace(/\./g,'').replace(',','.')))); }
  const md = t.match(/(\d{2})\/(\d{2})\/(\d{4})/);
  if(md) d.data = md[3]+'-'+md[2]+'-'+md[1];
  const linhas = t.split(/\s{2,}|\n/).map(s=>s.trim()).filter(s=>s.length>6);
  const ln = linhas.find(s=>/LTDA|ME$|EIRELI|S\/A|S\.A|COMERCIO|SERVICOS|SUPERMERC|POSTO|DISTRIBUID/i.test(s));
  if(ln) d.fornecedor = ln.slice(0,80);
  return (d.cnpj||d.valor) ? d : null;
}
async function fileParaBase64(file){
  const buf = await file.arrayBuffer();           // materializa (o File do Android não streama)
  const bytes = new Uint8Array(buf);
  if(!bytes.length) throw new Error('o arquivo veio vazio do seletor — tente escolher pela Galeria, ou copie a foto para o armazenamento interno');
  let bin = '', chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return { b64: btoa(bin), kb: Math.round(bytes.length/1024) };
}

async function lerPorIA(file){
  const { b64, kb } = await fileParaBase64(file);
  statusLeitura('Arquivo lido ('+kb+' KB). Mandando para a leitura…');
  const mime = file.type || 'image/jpeg';
  // tenta um nome de campo por vez (uma cópia só da imagem por chamada)
  const chaves = ['arquivoBase64'];   // confirmado no código da ler-nota (linha 80)
  let ultimoErro = '';
  for(const chave of chaves){
    const corpo = { mimeType: mime, mime_type: mime, tipo: 'nota', nome: file.name };
    corpo[chave] = b64;
    const { data, error } = await sb.functions.invoke('ler-nota', { body: corpo });
    if(!error){
      const lido = normalizarLeitura(data);
      if(lido) return lido;
      ultimoErro = 'a função respondeu, mas sem os campos da nota';
      continue;
    }
    let msg = error.message || String(error);
    try{ const j = await error.context.json(); if(j && (j.erro||j.error)) msg = j.erro||j.error; }
    catch(e){ try{ const t = await error.context.text(); if(t) msg = t.slice(0,200); }catch(e2){} }
    ultimoErro = msg;
    if(!/vazio|empty|obrigat|required|inform|missing|faltando/i.test(msg)) break; // erro que não é de campo: para
  }
  throw new Error(ultimoErro || 'a função não respondeu');
}

/* aceita qualquer formato de resposta da Edge Function: procura as chaves no JSON */
function lerLinhaPipe(txt){
  const t = String(txt||'').trim();
  if(!t || /^ERRO$/i.test(t) || t.indexOf('|') < 0) return null;
  const p = t.split('|').map(x=>x.trim());
  const d = {};
  if(soDig(p[0]).length === 14) d.cnpjPagador = soDig(p[0]);
  if(p[1]) d.fornecedor = p[1].slice(0,80);
  if(p[2]){ const n = Number(p[2].replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.')); if(n>0) d.valor = n; }
  if(p[3] && /^\d{4}-\d{2}-\d{2}$/.test(p[3])) d.data = p[3];
  if(p[4]) d.descricao = 'Documento nº '+p[4];
  return Object.keys(d).length ? d : null;
}

function normalizarLeitura(obj){
  if(!obj) return null;
  if(typeof obj === 'string'){
    const pipe = lerLinhaPipe(obj);
    if(pipe) return pipe;
    try{ obj = JSON.parse(obj); }catch(e){ return null; }
  }
  // a ler-nota pode devolver a linha em pipe dentro de algum campo
  if(typeof obj === 'object'){
    for(const k of Object.keys(obj)){
      if(typeof obj[k] === 'string' && obj[k].split('|').length >= 4){
        const pipe = lerLinhaPipe(obj[k]);
        if(pipe) return pipe;
      }
    }
  }
  const achado = {};
  (function cavar(o,nivel){
    if(!o || typeof o!=='object' || nivel>4) return;
    Object.keys(o).forEach(k=>{
      const v = o[k], kn = norm(k);
      if(v && typeof v==='object') return cavar(v,nivel+1);
      if(v==null || v==='') return;
      if(!achado.cnpj && /CNPJ/.test(kn) && soDig(v).length>=14) achado.cnpj = soDig(v).slice(0,14);
      else if(!achado.valor && /(VALOR|TOTAL)/.test(kn)){
        const n = typeof v==='number'? v : Number(String(v).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'));
        if(n>0) achado.valor = n;
      }
      else if(!achado.data && /(DATA|EMISSAO|VENCIMENTO)/.test(kn)){
        const s = String(v); const br = s.match(/(\d{2})\/(\d{2})\/(\d{4})/);
        achado.data = br ? br[3]+'-'+br[2]+'-'+br[1] : (/^\d{4}-\d{2}-\d{2}/.test(s)? s.slice(0,10) : null);
      }
      else if(!achado.fornecedor && /(FORNECEDOR|EMITENTE|RAZAO|NOME|LOJA|ESTABELEC)/.test(kn)) achado.fornecedor = String(v).slice(0,80);
      else if(!achado.descricao && /(DESCRICAO|ITENS|HISTORICO)/.test(kn)) achado.descricao = String(v).slice(0,120);
    });
  })(obj,0);
  return Object.keys(achado).length ? achado : null;
}

function empresaDoTexto(t){
  const achados = (t.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g)||[]).map(soDig).filter(validaCNPJ);
  if(!achados.length) return null;
  const cnpj = achados[0];
  // corta no próximo rótulo, porque o pdf.js junta tudo numa linha só
  const cortar = (txt)=> String(txt||'')
      .split(/\s*(?:Nome\s*Fantasia|CPF\s*\/?\s*CNPJ|CNPJ|Inscri[cç][aã]o|Endere[cç]o|Email|E-mail|Fone|Simples\s*Nacional|Incentivador)\b/i)[0]
      .replace(/\s{2,}/g,' ').trim().slice(0,90);
  let razao = '';
  const m = t.match(/Raz[aã]o\s*Social[:\s]*(.{5,150})/i);
  if(m) razao = cortar(m[1]);
  if(!razao){
    const ln = t.split(/\s{2,}|\n/).map(x=>x.trim()).find(x=>/LTDA|EIRELI|S\/A|S\.A|ME$/i.test(x) && x.length>6);
    if(ln) razao = ln.slice(0,90);
  }
  let fantasia = '';
  const mf = t.match(/Nome\s*Fantasia[:\s]*(.{3,120})/i);
  if(mf) fantasia = cortar(mf[1]);
  return { cnpj, razao, fantasia };
}

function extratoSaldos(t){
  const plano = String(t||'').replace(/\s+/g,' ');
  const ini = plano.match(/Saldo em\s+\d{2}\/\d{2}\/\d{4}:?\s*(-\s*)?R\$\s*([\d.]+,\d{2})/i);
  // o "Saldo atual" do cabeçalho é o de HOJE; num extrato de período passado
  // o que vale é o "Saldo no final do período"
  const fimPeriodo = plano.match(/Saldo no final do per[ií]odo\s*:?\s*(-\s*)?R\$\s*([\d.]+,\d{2})/i);
  const fimAtual   = plano.match(/Saldo atual\s*:?\s*(-\s*)?R\$\s*([\d.]+,\d{2})/i);
  const n = m => m ? (m[1]?-1:1) * Number(m[2].replace(/\./g,'').replace(',','.')) : null;
  return { inicial: n(ini), final: n(fimPeriodo || fimAtual), temFimPeriodo: !!fimPeriodo };
}

const MESES_ABR = { jan:1, fev:2, mar:3, abr:4, mai:5, jun:6, jul:7, ago:8, set:9, out:10, nov:11, dez:12 };

function ehFatura(txt){
  const t = String(txt||'');
  return /FATURA/i.test(t) && (/PAGAMENTOM[ÍI]NIMO|PAGAMENTO M[ÍI]NIMO|RESUMODAFATURA|LAN[ÇC]AMENTOS\s*[–-]/i.test(t));
}

function faturaDosItens(itens, txt){
  const plano = String(txt||'').replace(/\s+/g,' ');
  const meta = {};
  const mRef = plano.match(/REF\.?:?\s*(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\/(\d{4})/i);
  if(mRef){ meta.refMes = MESES_ABR[mRef[1].toLowerCase()]; meta.refAno = Number(mRef[2]); }
  const mVenc = plano.match(/VENCIMENTO:?\s*(\d{1,2})\s*(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\s*(\d{4})/i);
  if(mVenc){ meta.vencimento = mVenc[3]+'-'+String(MESES_ABR[mVenc[2].toLowerCase()]).padStart(2,'0')+'-'+mVenc[1].padStart(2,'0'); }
  const mTot = plano.match(/VALOR\s*TOTAL\s*DE\s*R\$\s*([\d.]+,\d{2})/i) || plano.match(/TOTAL:?\s*R\$\s*([\d.]+,\d{2})/i);
  if(mTot) meta.total = extratoValor(mTot[1]);
  const mDesp = plano.match(/DESPESAS\/?D[ÉE]BITOS\s*\+?\s*R\$\s*([\d.]+,\d{2})/i);
  if(mDesp) meta.despesas = extratoValor(mDesp[1]);
  const mCart = plano.match(/LAN[ÇC]AMENTOS[^A-Za-z0-9]{0,6}([A-Za-z ]{3,30})(\d{4})\*+[.\*]*(\d{4})/i);
  if(mCart){
    meta.bandeira = mCart[1].replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\s+/g,' ').trim();
    meta.final = mCart[3];
  }

  // linhas: junta os pedaços por altura
  const linhas = [];
  const grupos = [];
  itens.forEach(it=>{
    let g = grupos.find(gg=> gg.pag===it.pag && Math.abs(gg.y - it.y) <= 3);
    if(!g){ g = { pag:it.pag, y:it.y, partes:[] }; grupos.push(g); }
    g.partes.push(it);
  });
  grupos.sort((a,b)=> a.pag-b.pag || b.y-a.y);
  grupos.forEach(g=>{
    g.partes.sort((a,b)=>a.x-b.x);
    linhas.push(g.partes.map(x=>x.str).join(' ').replace(/R\s*\$/g,'R$').replace(/\s+/g,' ').trim());
  });

  const out = [];
  const re = /^(\d{1,2})\/(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\s+(.+?)\s*R\$\s*([\d.]+,\d{2})$/i;
  linhas.forEach(l=>{
    if(/^TOTAL/i.test(l)) return;
    const m = l.match(re);
    if(!m) return;
    const mes = MESES_ABR[m[2].toLowerCase()];
    let ano = meta.refAno || new Date().getFullYear();
    if(meta.refMes && mes > meta.refMes) ano--;          // compra do ano anterior
    const desc = m[3].replace(/\s+/g,' ').trim();
    const valor = extratoValor(m[4]);
    if(!valor || desc.length < 2) return;
    out.push({ data: ano+'-'+String(mes).padStart(2,'0')+'-'+m[1].padStart(2,'0'),
               descricao: desc.slice(0,140),
               contraparte: desc.replace(/\s*Parc\.\s*\d+\/\d+\s*$/i,'').trim().slice(0,80),
               valor, tipo:'saida', saldo:null, vencimento: meta.vencimento || null });
  });
  return { lancamentos: out, meta };
}

function extratoCabecalho(t){
  const plano = String(t||'').replace(/\s+/g,' ');
  const banco = (plano.match(/\b(UNICRED|BRADESCO|ITA[UÚ]|SANTANDER|BANCO DO BRASIL|CAIXA|NUBANK|INTER|SICOOB|SICREDI|C6|BTG|SAFRA)\b/i)||[])[1] || '';
  const conta = (plano.match(/Conta:?\s*([\d.-]+)/i)||[])[1] || '';
  const tit   = (plano.match(/Solicitado por\s+([A-ZÀ-Ÿ][^-*]{3,60})/i)||[])[1] || '';
  return { banco: banco ? banco.charAt(0)+banco.slice(1).toLowerCase() : '', conta, titular:(tit||'').trim() };
}

function extratoLimpa(d){

function extratoPorLinha(linhas){
  // montagem por estado: a data abre o lançamento, o valor pode vir em outra
  // linha (o pdf.js centraliza o valor quando a descrição ocupa 2 linhas)
  const out = [];
  let atual = null;
  const reData  = /^(\d{2}\/\d{2}\/\d{4})\b/;
  const reMoeda = /(-\s*)?R\$\s*([\d.]+,\d{2})/g;

  function fechar(){
    if(atual && atual.valor){
      // o pdf.js pode entregar os pedaços fora de ordem: o tipo do lançamento vai na frente
      const chefe = /^(DEBITO|CREDITO|LIQUIDACAO|TRANSFERENCIA|SEGURO|ARRECADACAO|IOF|JUROS|TARIFA|PAGAMENTO|SAQUE|DEPOSITO|COMPRA|ESTORNO)/i;
      const partes = atual.partes.filter(x=>x && x.trim());
      partes.sort((a,b)=> (chefe.test(b.trim())?1:0) - (chefe.test(a.trim())?1:0));
      const desc = extratoLimpa(partes.join(' '));
      if(extratoValido(desc)){
        out.push({ data:atual.data, descricao:desc.slice(0,140),
                   contraparte:((desc.match(/\/\s*([^)]{3,80})\)/)||[])[1]||'').trim(),
                   valor:atual.valor, tipo:atual.tipo });
      }
    }
    atual = null;
  }

  linhas.forEach(ln=>{
    const l = String(ln||'').replace(/\s+/g,' ').trim();
    if(!l) return;
    if(/CENTRAL DE RELACIONAMENTO|OUVIDORIA|^P[áa]g\.|Valor\s*\(R\$\)/i.test(l)) return;

    reMoeda.lastIndex = 0;
    const moedas = [];
    let mm;
    while((mm = reMoeda.exec(l)) !== null) moedas.push({ neg: !!mm[1], v: extratoValor(mm[2]) });
    const semMoeda = l.replace(/(-\s*)?R\$\s*[\d.]+,\d{2}/g, ' ').replace(/\s+/g,' ').trim();
    const md = l.match(reData);

    if(md){                                   // linha nova de lançamento
      fechar();
      const p = md[1].split('/');
      atual = { data:p[2]+'-'+p[1]+'-'+p[0], partes:[semMoeda.replace(reData,'').trim()], valor:null, tipo:'saida' };
      if(moedas.length){ atual.valor = moedas[0].v; atual.tipo = moedas[0].neg ? 'saida' : 'entrada'; }
      return;
    }
    if(!atual) return;
    if(moedas.length && !atual.valor){         // o valor veio numa linha só dele
      atual.valor = moedas[0].v;
      atual.tipo  = moedas[0].neg ? 'saida' : 'entrada';
      if(semMoeda) atual.partes.push(semMoeda);
      return;
    }
    if(!moedas.length && /[A-Za-zÀ-ÿ]/.test(semMoeda)){   // continuação da descrição
      atual.partes.push(semMoeda);
    }
  });
  fechar();
  return out;
}

function extratoCorrido(t){
  let plano = String(t||'').replace(/\s+/g,' ');
  const ini = plano.search(/Data\s+Lan[çc]amentos/i);
  if(ini > 0) plano = plano.slice(ini);
  plano = plano.replace(/CENTRAL DE RELACIONAMENTO[^]*?OUVIDORIA:?\s*\d+/gi,' ');
  const out = [];
  const re = /(\d{2}\/\d{2}\/\d{4})\s+(.*?)\s*(-\s*)?R\$\s*([\d.]+,\d{2})\s+(-\s*)?R\$\s*([\d.]+,\d{2})\s*([^]*?)(?=\d{2}\/\d{2}\/\d{4}\s|$)/g;
  let m;
  while((m = re.exec(plano)) !== null){
    const desc = extratoLimpa((m[2]||'')+' '+(m[7]||''));
    const valor = extratoValor(m[4]);
    if(!valor || !extratoValido(desc)) continue;
    const p = m[1].split('/');
    out.push({ data:p[2]+'-'+p[1]+'-'+p[0], descricao:desc.slice(0,140),
               contraparte:((desc.match(/\/\s*([^)]{3,80})\)/)||[])[1]||'').trim(),
               valor, tipo: m[3] ? 'saida' : 'entrada' });
  }
  return out;
}

async function lerExtrato(){
  const inp = document.getElementById('ex-arq');
  const f = inp && inp.files && inp.files[0];
  if(!f) return;
  statusExtrato('Lendo o extrato…');
  try{
    const itens = await itensDoPDF(f, 30);
    const texto = await textoDoPDF(f, 30);
    if(!texto || texto.replace(/\s/g,'').length < 60)
      return statusExtrato('<span style="color:var(--vermelho)">Esse PDF não tem texto (deve ser escaneado). Peça o extrato em PDF direto do banco.</span>');
    let cab = extratoCabecalho(texto);
    let linhas = extratoDosItens(itens);            // pelas colunas (preciso)
    let fat = null;
    if(linhas.length < 2 && ehFatura(texto)){
      const r = faturaDosItens(itens, texto);
      linhas = r.lancamentos; fat = r.meta;
      cab = { banco: (fat.bandeira||'Cartão'), conta: fat.final||'', titular: cab.titular||'' };
    }
    if(linhas.length < 2 && !fat) linhas = extratoLinhas(texto);   // reserva
    if(!linhas.length){
      const amostra = texto.split(/\n/).filter(x=>x.trim()).slice(3,9).join(' ⏎ ').slice(0,400);
      return statusExtrato('<span style="color:var(--vermelho)">Não reconheci nenhum lançamento nesse arquivo.</span>'+
        '<div style="margin-top:8px;font-size:11.5px;color:var(--fraco)"><b>O que eu li:</b><br>'+esc(amostra)+'</div>');
    }

    _extrato = { cab, linhas, texto };
    marcarRepetidos(null);
    const ent = linhas.filter(x=>x.tipo==='entrada'), sai = linhas.filter(x=>x.tipo==='saida');
    const rep = linhas.filter(x=>x.repetido).length;
    const sal = extratoSaldos(texto);
    let conferencia = '';
    if(fat){
      const soma = linhas.reduce((s,x)=>s+x.valor,0);
      const alvo = fat.despesas != null ? fat.despesas : fat.total;
      const dif = alvo != null ? Math.round((soma-alvo)*100)/100 : null;
      conferencia = (dif != null && Math.abs(dif) < 0.01)
        ? '<div class="ok">Fatura do cartão '+esc(fat.bandeira||'')+' final '+esc(fat.final||'—')+
          ': os lançamentos somam '+brl(soma)+', igual ao total da fatura. Vencimento '+dataBR(fat.vencimento)+'.</div>'
        : '<div class="erro">Fatura do cartão: os lançamentos somam '+brl(soma)+
          (alvo!=null? ', mas a fatura diz '+brl(alvo) : '')+'. Confira antes de importar.</div>';
    }
    const comSaldo = fat ? [] : linhas.filter(l=>l.saldo != null);
    if(comSaldo.length >= 2){
      // confere pela coluna de saldo: cada linha tem que explicar a anterior.
      // é mais confiável que o "Saldo em ...", cujo sinal alguns bancos não imprimem.
      const falhas = [];
      for(let i=1;i<comSaldo.length;i++){
        const a = comSaldo[i-1], b = comSaldo[i];
        const esperado = a.saldo + (b.tipo==='entrada' ? b.valor : -b.valor);
        if(Math.abs(esperado - b.saldo) > 0.01) falhas.push(b);
      }
      const ultimo = comSaldo[comSaldo.length-1];
      const fechaFim = sal.final == null || Math.abs(ultimo.saldo - sal.final) < 0.01;
      if(!falhas.length && fechaFim){
        conferencia = '<div class="ok">Conferência: fecha linha a linha com o extrato. Saldo final '+brl(ultimo.saldo)+'.</div>';
      } else if(falhas.length){
        const f = falhas[0];
        conferencia = '<div class="erro">Conferência: <b>'+falhas.length+' linha(s) não batem</b> com a coluna de saldo. '+
          'A primeira é '+dataBR(f.data)+' — '+esc(f.descricao.slice(0,60))+' ('+brl(f.valor)+'). Confira antes de importar.</div>';
      } else {
        conferencia = '<div class="erro">Conferência: as linhas batem entre si, mas o saldo final lido ('+brl(ultimo.saldo)+
          ') não é o do extrato ('+brl(sal.final)+'). Pode faltar um lançamento no fim.</div>';
      }
    } else if(!fat && sal.inicial != null && sal.final != null){
      const calc = sal.inicial + ent.reduce((s,x)=>s+x.valor,0) - sai.reduce((s,x)=>s+x.valor,0);
      const dif = Math.round((calc - sal.final)*100)/100;
      conferencia = Math.abs(dif) < 0.01
        ? '<div class="ok">Conferência: fecha com o extrato. Saldo '+brl(sal.final)+'.</div>'
        : '<div class="erro">Conferência: <b>não fecha</b> — diferença de '+brl(Math.abs(dif))+'.</div>';
    }
    const nomeSug = [cab.banco, cab.conta].filter(Boolean).join(' · ') || (cab.titular||'Conta');

    statusExtrato('Lido do PDF, sem custo de IA.');
    _extrato.render = () => desenharExtrato(conferencia);
    _extrato.render();
  }catch(e){ statusExtrato('<span style="color:var(--vermelho)">Não deu para ler: '+esc(e.message)+'</span>'); }
}

/* marca o que já foi lançado ANTES, na MESMA conta — duas contas podem ter
   a mesma tarifa no mesmo dia, e isso não é repetição */
function marcarRepetidos(origemId){
  if(!_extrato) return;
  const jaTem = new Set(S.movimentos
    .filter(m=> !origemId || m.origem_id === origemId)
    .map(m=> (m.origem_id||'-')+'|'+m.data_movimento+'|'+Number(m.valor).toFixed(2)+'|'+(m.descricao||'').slice(0,60)));
  _extrato.linhas.forEach(l=>{
    l.repetido = !!origemId && jaTem.has(origemId+'|'+l.data+'|'+l.valor.toFixed(2)+'|'+l.descricao.slice(0,60));
  });
}

function trocouOrigemExtrato(){

async function importarExtrato(){
  if(!_extrato) return;
  const empresaEnt = val('ex-empresa') || null;
  let origemId = val('ex-origem') || null;

  if(!origemId){
    const cab = _extrato.cab;
    const ehCartao = _extrato.linhas.some(l=>l.vencimento);
    const nome = [cab.banco, cab.titular].filter(Boolean).join(' — ') || (ehCartao?'Cartão':'Conta importada');
    const { data, error } = await sb.from('origens')
      .insert({ nome, tipo: ehCartao?'cartao':'conta', identificador: cab.conta||null, titular: cab.titular||null })
      .select().maybeSingle();
    if(error){
      // já existe uma origem para essa conta: usa ela em vez de reclamar
      const { data:achada } = await sb.from('origens').select('*')
        .eq('identificador', cab.conta||'').limit(1);
      let ja = (achada && achada[0]) || S.origens.find(o=>
        (o.identificador||'') === (cab.conta||'') || norm(o.nome) === norm(nome));
      if(!ja) return aviso('Não criou a origem: '+error.message,'erro');
      if(!S.origens.find(o=>o.id===ja.id)) S.origens.push(ja);
      origemId = ja.id;
      statusExtrato('Usando a conta já cadastrada: '+esc(ja.nome)+'.');
    } else {
      S.origens.push(data); origemId = data.id;
    }
  }

  marcarRepetidos(origemId);
  const novos = _extrato.linhas.filter(l=>!l.repetido)
    .map(l=>{
      const daFatura = !!l.vencimento;
      const base = { tipo:l.tipo, origem_id:origemId, valor:l.valor, data_movimento:l.data,
                     descricao:l.descricao, fornecedor:l.contraparte||null,
                     pago: !daFatura, data_pagamento: daFatura ? null : l.data,
                     vencimento: l.vencimento || null, criado_por:S.user.id };
      const sug = sugerirEmpresa({ fornecedor:l.contraparte, origem_id:origemId });
      if(l.tipo==='entrada' && empresaEnt) base.empresa_id = empresaEnt;
      else if(sug) base.empresa_id = sug;
      return base;
    });

  if(!novos.length) return aviso('Nada novo para importar.','ok');

  statusExtrato('Gravando '+novos.length+' lançamentos…');
  let gravados = 0;
  for(let i=0; i<novos.length; i+=100){
    const lote = novos.slice(i, i+100);
    const { data, error } = await sb.from('movimentos').insert(lote).select();
    if(error){ aviso('Parou no lançamento '+(i+1)+': '+error.message,'erro'); break; }
    (data||[]).forEach(m=>S.movimentos.unshift(m));
    gravados += (data||[]).length;
    statusExtrato('Gravando… '+gravados+' de '+novos.length);
  }
  _extrato = null; S.modal = null;
  aviso(gravados+' lançamentos importados. O que ficou sem empresa está em "Apontar depois".','ok');
}

  const id = val('or-id'), nome = val('or-nome').trim();

                titular: val('or-titular').trim()||null, empresa_id: val('or-empresa')||null };

}

var _perm = null;   // { id, abas:[]|null, hosp:[]|null, emp:[] , listaHosp:[] }
function permResumo(p){
  if(p.papel==='mestre') return '<span style="color:var(--fraco)">tudo</span>';
  if(p.papel==='anestesista') return '<span style="color:var(--fraco)">só a escala dele</span>';
  const tot = CPE_ABAS.reduce((n,g)=>n+g[1].length,0);

  const h = Array.isArray(p.hospitais) && p.hospitais.length ? p.hospitais.length+' hospita'+(p.hospitais.length===1?'l':'is') : 'todos os hospitais';
  const ne = (S.permEmp||{})[p.id]; const e = ne && ne.length ? ne.length+' CNPJ'+(ne.length===1?'':'s') : 'todos os CNPJs';

async function permCarregarListas(){
  const [l,hc,pe] = await Promise.all([
    sb.from('esc_locais').select('hospital,unidade'),
    sb.from('esc_hospitais').select('nome,ativo'),
    sb.from('perfil_empresas').select('perfil_id,empresa_id')
  ]);
  const m = {};
  (hc.data||[]).forEach(x=>{ if(x.nome) m[permNorm(x.nome)] = m[permNorm(x.nome)] || x.nome.trim(); });
  (l.data||[]).forEach(x=>{ const n = (x.hospital||x.unidade||'').trim(); if(n) m[permNorm(n)] = m[permNorm(n)] || n; });
  S.permHosp = Object.keys(m).map(k=>m[k]).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  S.permEmp = {}; (pe.data||[]).forEach(x=>{ (S.permEmp[x.perfil_id] = S.permEmp[x.perfil_id] || []).push(x.empresa_id); });
}
async function abrirPerm(id){
  if(!S.permHosp){ try{ await permCarregarListas(); }catch(e){ return aviso('Não carregou a lista de hospitais: '+e.message,'erro'); } }
  const p = S.perfis.find(x=>x.id===id) || {};
  _perm = { id, abas: Array.isArray(p.abas) ? p.abas.slice() : CPE_ABAS.reduce((a,g)=>a.concat(g[1].map(x=>x[0])),[]),
            hosp: Array.isArray(p.hospitais) ? p.hospitais.slice() : [], emp: ((S.permEmp||{})[id]||[]).slice(), busca:'' };

}
function permTog(tipo, v){
  const arr = _perm[tipo]; const i = tipo==='hosp' ? arr.map(permNorm).indexOf(permNorm(v)) : arr.indexOf(v);
  if(i>=0) arr.splice(i,1); else arr.push(v); permDesenhar();
}
function permTodos(tipo){ if(tipo==='abas') _perm.abas = CPE_ABAS.reduce((a,g)=>a.concat(g[1].map(x=>x[0])),[]); else _perm[tipo] = []; permDesenhar(); }
function permNenhum(tipo){ _perm[tipo] = []; permDesenhar(); }
function permChk(on, rot, acao, sub){
  return '<button type="button" class="pchk'+(on?' on':'')+'" onclick="'+acao+'"><span class="cx">'+(on?'✓':'')+'</span><span>'+rot+(sub?'<small>'+sub+'</small>':'')+'</span></button>';

function permDesenhar(){
  const P = _perm, p = S.perfis.find(x=>x.id===P.id) || {};
  const todasH = !P.hosp.length, todasE = !P.emp.length;
  const busca = permNorm(P.busca);

  let h = '<h2>🔒 Permissões</h2><div style="color:var(--fraco);margin-bottom:10px">'+esc(p.nome||p.email||'')+' · <b>'+esc(p.papel||'')+'</b></div>'+
    '<div class="psec"><div class="pti"><b>1. ABAS QUE ELE VÊ</b><span><a href="#" onclick="permTodos(\'abas\');return false">marcar todas</a> · <a href="#" onclick="permNenhum(\'abas\');return false">limpar</a></span></div>'+
    CPE_ABAS.map(g=>'<div class="pgr">'+g[0]+'</div><div class="pgrid">'+g[1].map(x=>permChk(P.abas.indexOf(x[0])>=0, x[1]+' '+x[2], "permTog('abas','"+x[0]+"')")).join('')+'</div>').join('')+

function escResumoEmpresas(trab){

async function escSalvarDia(id, campos){
  const r = await sb.from('esc_dias').update(campos).eq('id', id).select().maybeSingle();
  if(r.error){ aviso('Não gravou: '+r.error.message,'erro'); return false; }
  const i = S.esc.dias.findIndex(x=>x.id===id); if(i>=0) S.esc.dias[i] = r.data;
  render(); return true;
}
function escSet(id, campo, valor){ const c = {}; c[campo] = valor; if(campo==='status' && valor==='feriado'){ c.anestesista_id=null; c.valor=null; c.pago=false; } escSalvarDia(id, c); }
function escSetAnes(id, anesId){
  const d = S.esc.dias.find(x=>x.id===id); if(!d) return;
  const c = { anestesista_id: anesId || null };
  if(anesId){
    if(d.valor==null){ const v = escValorPadrao(d, anesId); if(v!=null) c.valor = v; }
    if(!d.empresa_id){ const l = escLocal(d.local_id); if(l.empresa_id) c.empresa_id = l.empresa_id; }
  }
  escSalvarDia(id, c);
}
function escSetPago(id, on){ escSalvarDia(id, { pago: !!on, pago_em: on ? hojeISO() : null }); }

async function escSalvarAnes(){
  const nome = val('ea-nome').trim(); if(!nome) return aviso('Informe o nome.','erro');
  const reg = { nome, crm: val('ea-crm').trim()||null, telefone: val('ea-tel').trim()||null, pix: val('ea-pix').trim()||null,
    valor_dia: val('ea-valor')===''? null : Number(val('ea-valor')), obs: val('ea-obs').trim()||null };
  if(_escAnesEd) reg.ativo = chk('ea-ativo');
  // v65: o Renato cadastrou o mesmo anestesista duas vezes porque não via a confirmação — avisa nome repetido
  const nn = s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/^dra?\.?\s+/,'').replace(/\s+/g,' ').trim();
  const igual = S.esc.anes.find(x=>(!_escAnesEd || x.id!==_escAnesEd.id) && (nn(x.nome)===nn(nome) || nn(x.nome).indexOf(nn(nome)+' ')===0 || nn(nome).indexOf(nn(x.nome)+' ')===0));
  if(igual && !confirm('Já existe "'+igual.nome+'" em '+escGrupo()+'. Cadastrar "'+nome+'" mesmo assim?')) return;
  const r = _escAnesEd ? await sb.from('esc_anestesistas').update(reg).eq('id',_escAnesEd.id).select().maybeSingle()
                       : await sb.from('esc_anestesistas').insert(Object.assign({ grupo: escGrupo() }, reg)).select().maybeSingle();
  if(r.error) return aviso('Não gravou: '+r.error.message,'erro');
  S.anesTodos = null;
  const i = S.esc.anes.findIndex(x=>x.id===r.data.id); if(i>=0) S.esc.anes[i]=r.data; else S.esc.anes.push(r.data);
  S.esc.anes.sort((x,y)=>x.nome.localeCompare(y.nome,'pt-BR'));
  _escAnesOk = (_escAnesEd ? 'Alterações de ' : '')+r.data.nome+(_escAnesEd ? ' salvas.' : ' cadastrado(a) em '+escGrupo()+'. Já aparece na lista acima.');
  escAbrirAnestesistas(); _escAnesOk = '';
}

      empresa_id: val('el-emp-'+l.id)||null, valor_dia: val('el-val-'+l.id)===''? null : Number(val('el-val-'+l.id)), ativo: chk('el-ativo-'+l.id) };
    const mudou = reg.unidade!==l.unidade || reg.hospital!==(l.hospital||null) || reg.cidade!==(l.cidade||null) || reg.empresa_id!==(l.empresa_id||null) ||
      reg.valor_dia!=(l.valor_dia==null?null:Number(l.valor_dia)) || reg.ativo!==(l.ativo!==false);

async function escLerFoto(){

/* ---------- pagamentos no Painel ---------- */
async function escLancarPainel(){
  const vis = escLocaisVis().map(l=>l.id);
  const trab = escDoMes().filter(d=>vis.indexOf(d.local_id)>=0 && escTrabalho(d) && d.anestesista_id && escValidado(d) && (Number(d.valor)||0)>0);
  const g = {};
  trab.forEach(d=>{ const k = d.anestesista_id+'|'+(d.empresa_id||''); const x = g[k] = g[k] || { anes:d.anestesista_id, emp:d.empresa_id||null, n:0, total:0 }; x.n++; x.total += Number(d.valor)||0; });
  const ks = Object.keys(g); if(!ks.length) return alert('Nenhum dia com anestesista e valor neste mês.');
  if(ks.some(k=>!g[k].emp) && !confirm('Tem dia sem CNPJ definido — esses pagamentos vão para "Apontar depois". Continuar?')) return;
  if(!confirm('Lançar '+ks.length+' pagamento(s) de '+escMesNome(S.mes)+' ('+S.esc.hosp+') no Painel como saídas a pagar?')) return;
  let feitos=0, pulados=0;
  for(const k of ks){
    const x = g[k], a = escAnes(x.anes) || { nome:'?' };
    const desc = 'Escala '+(escGrupo()==='NAFS'?'anestesia':escGrupo().toLowerCase())+' '+escMesNome(S.mes)+' — '+S.esc.hosp+' — '+a.nome+' ('+x.n+' dia'+(x.n>1?'s':'')+')';
    if(S.movimentos.some(m=>m.categoria==='Escala anestesia' && m.descricao===desc && (m.empresa_id||null)===x.emp)){ pulados++; continue; }
    const reg = { tipo:'saida', empresa_id:x.emp, valor: Math.round(x.total*100)/100, data_movimento: escUltimoDia(S.mes),
      fornecedor: a.nome, categoria:'Escala anestesia', descricao: desc, pago:false, criado_por: S.user.id };
    const r = await sb.from('movimentos').insert(reg).select().maybeSingle();
    if(r.error) return aviso('Parou num erro: '+r.error.message,'erro');
    S.movimentos.unshift(r.data); feitos++;
  }
  aviso(feitos+' pagamento(s) lançado(s) no Painel'+(pulados?' · '+pulados+' já existia(m)':'')+'.','ok');
}

/* ===== v64 (21/10/2026): caixa "🏥 Hospitais" — CADASTRO DE HOSPITAIS =====
   Pedido do Renato: cada hospital tem uma forma diferente de pagamento e de serviços.
   Tabela esc_hospitais (liga com esc_locais pelo NOME do hospital): forma de pagamento — por plantão/dia,
   por turno (Manhã/Tarde/Noite), por procedimento (lista de serviços com preço) ou valor fixo mensal —,
   prazo de pagamento, CNPJ/razão social, contato, serviços e observações.
   O valor de cada atendimento passa a sair do hospital: vale primeiro o valor do anestesista (se tiver),
   depois a regra do hospital, e por último o valor do dia da unidade (como era antes). */
const HOSP_FORMAS = { dia:'Por plantão / dia', turno:'Por turno', procedimento:'Por procedimento', mensal:'Valor fixo mensal' };
async function hospCarregar(){
  const r = await sb.from('esc_hospitais').select('*').order('nome');
  if(r.error){ S.esc.hospCad = []; S.esc.hospErro = r.error.message; return; }
  S.esc.hospCad = (r.data || []).filter(h=>veHosp(h.nome)); S.esc.hospErro = '';
}
function hospCad(nome){ const n = String(nome||'').trim().toLowerCase(); return (S.esc.hospCad||[]).find(h=>String(h.nome).trim().toLowerCase()===n) || null; }
function hospDoLocal(localId){ return hospCad(escHospNome(escLocal(localId))); }
function hospServicos(h){ return Array.isArray(h && h.servicos) ? h.servicos.filter(s=>s && s.nome) : []; }
/* valor do atendimento pela regra do hospital (null = o hospital não define) */
function hospValor(h, d){
  if(!h) return null;
  const n = x => x==null || x==='' ? null : Number(x);
  if(h.forma_pagamento==='turno'){
    const t = escTurnoNorm(d && d.turno); if(!t) return n(h.valor_dia);
    let s = 0, ok = false; [['M','valor_m'],['T','valor_t'],['N','valor_n']].forEach(p=>{ if(t.indexOf(p[0])>=0 && n(h[p[1]])!=null){ s += n(h[p[1]]); ok = true; } });
    return ok ? s : n(h.valor_dia);
  }
  if(h.forma_pagamento==='procedimento'){
    const sv = hospServicos(h).find(s=>d && d.servico && s.nome===d.servico);
    return sv && n(sv.valor)!=null ? n(sv.valor) : null;
  }
  if(h.forma_pagamento==='mensal') return null;   // o contrato é do mês inteiro, não de cada atendimento
  return n(h.valor_dia);
}
function hospPrazoTxt(h){
  if(!h) return '—';
  if(h.prazo_tipo==='dia_fixo' && h.prazo_dia_mes) return 'dia '+h.prazo_dia_mes+' do mês seguinte';
  if(h.prazo_dias) return h.prazo_dias+' dias depois do fim do mês';
  return 'não informado';
}
function hospPrazoData(h, mes){
  if(!h) return null; const p = String(mes).split('-'), y = +p[0], m = +p[1];
  if(h.prazo_tipo==='dia_fixo' && h.prazo_dia_mes){ const d = new Date(y, m, Math.min(28, +h.prazo_dia_mes)); return d.toISOString().slice(0,10); }
  if(h.prazo_dias){ const d = new Date(y, m, 0); d.setDate(d.getDate() + (+h.prazo_dias)); return d.toISOString().slice(0,10); }
  return null;
}
function hospRegraTxt(h){
  if(!h) return '<span style="color:var(--vermelho)">sem cadastro</span>';
  const f = h.forma_pagamento;
  if(f==='turno') return 'Manhã '+(h.valor_m!=null?brl(+h.valor_m):'—')+' · Tarde '+(h.valor_t!=null?brl(+h.valor_t):'—')+' · Noite '+(h.valor_n!=null?brl(+h.valor_n):'—');
  if(f==='procedimento'){ const s = hospServicos(h); return s.length ? s.length+' serviço(s) com preço' : '<span style="color:var(--vermelho)">nenhum serviço com preço</span>'; }
  if(f==='mensal') return h.valor_mensal!=null ? brl(+h.valor_mensal)+' por mês' : '<span style="color:var(--vermelho)">valor do mês não informado</span>';
  return h.valor_dia!=null ? brl(+h.valor_dia)+' por plantão' : '<span style="color:var(--vermelho)">valor do plantão não informado</span>';
}

      (x.cnpj ? '<small>CNPJ '+esc(x.cnpj)+'</small>' : '')+'</div><span class="seta">›</span></button>';
  }).join('')+'</div>';
  return h;

  const aj = document.getElementById('hc-serv-ajuda'); if(aj) aj.innerHTML = proc ? 'Cada serviço tem o seu preço — no atendimento a equipe escolhe o serviço e o valor entra sozinho.' : 'O que a equipe faz neste hospital (o preço só é usado quando a forma é <b>por procedimento</b>).';
  box.innerHTML = _hospServ.length ? _hospServ.map((s,i)=>'<div class="lin" style="align-items:flex-end"><div><label>Serviço</label><input id="hcs-n-'+i+'"'+ro+' value="'+esc(s.nome||'')+'" placeholder="Anestesia geral"></div>'+
      '<div style="max-width:170px"><label>Preço (R$)'+(proc?'':' — opcional')+'</label><input id="hcs-v-'+i+'"'+ro+' type="number" step="0.01" inputmode="decimal" value="'+esc(s.valor==null?'':s.valor)+'"></div>'+
      (podeEditar()?'<div style="max-width:60px"><button class="bt g mini" onclick="hospServDel('+i+')">×</button></div>':'')+'</div>').join('')
    : '<div style="font-size:12.5px;color:var(--fraco);margin-bottom:6px">Nenhum serviço ainda.</div>';
}
function hospServAdd(){ hospServGuardar(); _hospServ.push({ nome:'', valor:'' }); hospServDesenhar(); }
function hospServDel(i){ hospServGuardar(); _hospServ.splice(i,1); hospServDesenhar(); }
function hospFormaTroca(){
  const f = hospForma(), mostra = (id, on) => { const e = document.getElementById(id); if(e) e.style.display = on ? '' : 'none'; };
  mostra('hc-f-dia', f==='dia'); mostra('hc-f-turno', f==='turno'); mostra('hc-f-mensal', f==='mensal');
  hospServGuardar(); hospServDesenhar();
}
async function hospSalvar(){
  hospServGuardar();
  const num = id => { const v = val(id); return v==='' ? null : Number(v); }, f = hospForma();
  const nome = val('hc-nome').trim(); if(!nome) return aviso('Informe o nome do hospital.','erro');
  const serv = _hospServ.filter(s=>String(s.nome||'').trim()).map(s=>({ nome:String(s.nome).trim(), valor: s.valor===''||s.valor==null ? null : Number(s.valor) }));
  if(f==='procedimento' && !serv.some(s=>s.valor!=null)) return aviso('Por procedimento: cadastre pelo menos um serviço com preço.','erro');
  const reg = { nome, cnpj: val('hc-cnpj').trim()||null, razao_social: val('hc-razao').trim()||null, contato_nome: val('hc-cnome').trim()||null,
    contato_tel: val('hc-ctel').trim()||null, contato_email: val('hc-cmail').trim()||null, forma_pagamento: f,
    valor_dia: f==='turno' ? num('hc-vdia2') : num('hc-vdia'), valor_m: num('hc-vm'), valor_t: num('hc-vt'), valor_n: num('hc-vn'), valor_mensal: num('hc-vmes'),
    servicos: serv, prazo_tipo: val('hc-ptipo')||'dias', prazo_dias: num('hc-pdias'), prazo_dia_mes: num('hc-pdia'), obs: val('hc-obs').trim()||null,
    ativo: chk('hc-ativo'), atualizado_em: new Date().toISOString() };
  const antigo = _hospEd ? _hospEd.nome : null;
  const r = _hospEd ? await sb.from('esc_hospitais').update(reg).eq('id', _hospEd.id).select().maybeSingle()
                    : await sb.from('esc_hospitais').insert(reg).select().maybeSingle();
  if(r.error) return aviso(/duplicate|unique/i.test(r.error.message) ? 'Já existe um hospital com esse nome.' : 'Não gravou: '+r.error.message,'erro');
  if(_hospEd) Object.assign(_hospEd, r.data); else S.esc.hospCad.push(r.data);
  // v65: desabilitar/reativar no cadastro vale também para as unidades do hospital
  for(const l of S.esc.locais.filter(l=>escHospNome(l)===(antigo||nome) && (l.ativo!==false)!==reg.ativo)){ const u = await sb.from('esc_locais').update({ ativo: reg.ativo }).eq('id', l.id).select().maybeSingle(); if(!u.error) Object.assign(l, u.data); }
  // renomeou: as unidades acompanham o nome novo, senão o hospital perde as unidades
  if(antigo && antigo!==nome){
    const us = S.esc.locais.filter(l=>escHospNome(l)===antigo);
    for(const l of us){ const u = await sb.from('esc_locais').update({ hospital:nome }).eq('id', l.id).select().maybeSingle(); if(!u.error) Object.assign(l, u.data); }
  }
  S.esc.hospCad.sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  S.modal = null; aviso('Hospital salvo.','ok');
}
async function hospExcluir(){
  if(!_hospEd || !confirm('Excluir o cadastro de '+_hospEd.nome+'? As unidades e a escala continuam; só some a forma de pagamento.')) return;
  const r = await sb.from('esc_hospitais').delete().eq('id', _hospEd.id);
  if(r.error) return aviso('Não excluiu: '+r.error.message,'erro');
  S.esc.hospCad = S.esc.hospCad.filter(x=>x.id!==_hospEd.id); S.modal = null; aviso('Cadastro excluído.','ok');
}
/* serviço no atendimento: só aparece quando o hospital da unidade cobra por procedimento */
function hospServCampoHTML(localId, atual){
  const h = hospDoLocal(localId); if(!h || h.forma_pagamento!=='procedimento') return '';
  return '<div><label>Serviço ('+esc(h.nome)+')</label><select id="ed-serv" onchange="hospServTroca()"><option value="">— escolher —</option>'+
    hospServicos(h).map(s=>'<option value="'+esc(s.nome)+'"'+(s.nome===atual?' selected':'')+'>'+esc(s.nome)+(s.valor!=null?' · '+brl(+s.valor):'')+'</option>').join('')+'</select></div>';
}
function hospServAtualizar(){
  const box = document.getElementById('ed-servbox'); if(!box) return;
  const loc = val('ed-local'), atual = val('ed-serv');
  box.innerHTML = hospServCampoHTML(loc, atual);
}
function hospServTroca(){
  const h = hospDoLocal(val('ed-local')), sv = hospServicos(h).find(s=>s.nome===val('ed-serv')), v = document.getElementById('ed-valor');
  if(v && sv && sv.valor!=null) v.value = sv.valor;
}

</script>
